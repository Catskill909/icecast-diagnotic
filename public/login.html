<title>Sign in · Stream Monitor</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">

<div class="card">
  <div class="logo">📻</div>
  <h1 id="title">Sign in</h1>
  <div class="sub" id="sub">Stream monitor administration</div>

  <!-- Step 1 — username. Deliberately accepts anything and advances: refusing
       here would turn this form into a way to discover valid usernames. -->
  <form id="step1">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="off"
           autocorrect="off" spellcheck="false" required autofocus>
    <button type="submit">Continue</button>
  </form>

  <!-- Step 2 — password. Both halves are checked together on the server. -->
  <form id="step2" class="hidden">
    <div class="identity">
      <span>👤</span>
      <span class="who" id="who"></span>
    </div>
    <label for="password">Password</label>
    <div class="pw-wrap">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" title="Show password">👁</button>
    </div>
    <button type="submit" id="submitBtn">Sign in</button>
    <button type="button" class="back" id="backBtn">Use a different account</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="foot">Protected area · unlisted</div>
</div>

<script src="login.js"></script>
