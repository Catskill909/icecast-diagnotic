services:
  icecast-monitor:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - monitor-data:/app/data
    environment:
      - PORT=3000
      - CHECK_INTERVAL_MS=60000
      - FAILURE_THRESHOLD=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  monitor-data:
    driver: local
